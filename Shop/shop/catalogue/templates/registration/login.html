{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
    <style>
      body {
        background-image: url("{% static 'images/fruit.jpeg' %}");
        background-size: cover;
        background-repeat: no-repeat;
        background-position: center;
      }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="max-w-md w-full bg-white rounded p-8 shadow-lg">
        <h2 class="text-2xl font-bold mb-6 text-center">Login</h2>
        <form method="post" novalidate>
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="w-full bg-pink-500 hover:bg-pink-600 text-white font-semibold py-2 rounded">
                Log in
            </button>
            {% if form.errors %}
                <p class="mt-4 text-red-600 text-center">Invalid username or password.</p>
            {% endif %}
        </form>
    </div>
</body>
</html>
