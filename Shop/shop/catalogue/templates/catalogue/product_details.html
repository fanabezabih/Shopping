<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ product.name }}</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-xl mx-auto bg-white rounded-lg shadow-md p-6 flex flex-col items-center">
        {% if product.image %}
            <img src="{{ product.image.url }}" alt="{{ product.name }}" class="w-48 h-48 object-cover rounded-lg mb-6" />
        {% else %}
       
            <div class="w-48 h-48 bg-gray-200 rounded-lg flex items-center justify-center text-gray-400 font-semibold text-xl mb-6">
                No Image
            </div>
        {% endif %}
        
        <div class="text-center">
            <h3 class="text-2xl font-bold mb-4">{{ product.name }}</h3>
            <p class="mb-4 text-gray-700">{{ product.description }}</p>
            <p class="mb-6 font-semibold text-lg">Price: KSH{{ product.price }}</p>
            <form action="{% url 'add_to_cart' product.id %}" method="post" class="inline-block">
                {% csrf_token %}
                <button type="submit" class="bg-pink-500 text-white px-4 py-2 rounded hover:bg-pink-600 transition">
                    Add to Cart
                </button>
            </form>
            <div class="mt-6">
                <a href="{% url 'list_products' %}" class="text-pink-500 hover:underline">Back to products</a>
            </div>
        </div>
    </div>
</body>
</html>
