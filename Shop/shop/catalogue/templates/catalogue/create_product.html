<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Create Product</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fcfcfc;
            margin: 0;
            padding: 20px;
        }
        h3 {
            color: #334e68;
            text-align: center;
            margin-bottom: 20px;
        }
        form.Create-product {
            background-color: rgb(218, 94, 94);
            max-width: 500px;
            margin: 0 auto;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        form.Create-product input[type="text"],
        form.Create-product input[type="number"],
        form.Create-product textarea,
        form.Create-product select,
        form.Create-product input[type="file"] {
            width: 100%;
            padding: 10px;
            margin: 6px 0 15px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
            transition: border-color 0.3s ease;
        }
        form.Create-product input[type="text"]:focus,
        form.Create-product input[type="number"]:focus,
        form.Create-product textarea:focus,
        form.Create-product select:focus,
        form.Create-product input[type="file"]:focus {
            border-color: #007BFF;
            outline: none;
        }
        form.Create-product button {
            width: 100%;
            background-color: #007BFF;
            border: none;
            color: white;
            padding: 12px;
            cursor: pointer;
            font-size: 16px;
            border-radius: 4px;
            transition: background-color 0.3s ease;
        }
        form.Create-product button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <h3>Create Product</h3>
    <form method="POST" enctype="multipart/form-data" class="Create-product">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Save</button>
    </form>
</body>
</html>
